<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ishu Raj — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --fg: #0a0a0a;
    --bg: #f4f2ee;
    --mute: #8a8680;
    --line: rgba(10,10,10,0.12);
    --accent: #0a0a0a;
    --inv-fg: #f4f2ee;
    --inv-bg: #0a0a0a;
    --grid-gutter: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
    cursor: none;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: none; }

  ::selection { background: var(--fg); color: var(--bg); }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* Custom cursor */
  .cursor-dot, .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    mix-blend-mode: difference;
  }
  .cursor-dot {
    width: 6px; height: 6px;
    background: #fff;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1px solid #fff;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1), border-radius 0.25s ease, background 0.2s ease, color 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .cursor-ring.is-link {
    width: 64px; height: 64px;
    background: #fff;
    color: #000;
    mix-blend-mode: difference;
  }
  .cursor-ring.is-drag {
    width: 88px; height: 88px;
    border-radius: 4px;
  }
  .cursor-ring.is-text {
    width: 2px; height: 24px;
    border-radius: 1px;
    background: #fff;
  }

  /* Grid scaffolding */
  .container {
    width: 100%;
    padding: 0 32px;
  }
  .grid-12 {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
  }

  /* Top nav */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px 32px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
    align-items: center;
    mix-blend-mode: difference;
    color: #fff;
  }
  .nav-brand {
    grid-column: span 3;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .nav-brand .dot { display: inline-block; width: 6px; height: 6px; background: currentColor; border-radius: 50%; margin-right: 8px; vertical-align: middle; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .nav-links {
    grid-column: 6 / span 7;
    display: flex;
    gap: 32px;
    justify-content: flex-end;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .nav-links a { position: relative; overflow: hidden; display: inline-block; }
  .nav-links a span { display: inline-block; transition: transform 0.4s cubic-bezier(.7,0,.3,1); }
  .nav-links a span.b { position: absolute; left: 0; top: 100%; }
  .nav-links a:hover span.a { transform: translateY(-100%); }
  .nav-links a:hover span.b { transform: translateY(-100%); }
  .nav-time {
    grid-column: span 2;
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  /* Section base */
  section {
    position: relative;
    padding: 120px 0;
  }
  .section-meta {
    grid-column: span 2;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
    padding-top: 4px;
    position: sticky;
    top: 80px;
    align-self: start;
  }
  .section-meta .num { display: block; color: var(--fg); margin-bottom: 4px; font-weight: 500; }

  /* Hero */
  .hero {
    min-height: 100vh;
    padding: 0 32px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 48px;
    position: relative;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
    align-items: end;
  }
  .hero-title {
    grid-column: 1 / -1;
    font-size: clamp(64px, 18.5vw, 320px);
    font-weight: 500;
    line-height: 0.82;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    margin-left: -0.04em;
  }
  .hero-title .char { display: inline-block; }
  .hero-title .word { display: inline-block; margin-right: 0.06em; }
  .hero-sub-row {
    grid-column: 1 / -1;
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }
  .hero-sub-row > div { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.04em; }
  .hero-sub-row .label { color: var(--mute); text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em; margin-bottom: 6px; }
  .hero-sub-1 { grid-column: span 3; }
  .hero-sub-2 { grid-column: span 3; }
  .hero-sub-3 { grid-column: span 3; }
  .hero-sub-4 { grid-column: span 3; text-align: right; }

  .hero-corner-tl, .hero-corner-tr {
    position: absolute;
    top: 84px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
    line-height: 1.6;
  }
  .hero-corner-tl { left: 32px; }
  .hero-corner-tr { right: 32px; text-align: right; }

  .scroll-cue {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--mute);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translate(-50%, 0); opacity: 0.6; } 50% { transform: translate(-50%, 6px); opacity: 1; } }

  /* Marquee */
  .marquee {
    border-top: 1px solid var(--fg);
    border-bottom: 1px solid var(--fg);
    overflow: hidden;
    padding: 22px 0;
    background: var(--fg);
    color: var(--bg);
    white-space: nowrap;
  }
  .marquee-track {
    display: inline-flex;
    gap: 64px;
    animation: scroll-x 24s linear infinite;
    font-size: clamp(28px, 4vw, 64px);
    font-weight: 500;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 1;
  }
  .marquee-track .ast { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 300; opacity: 0.6; transform: translateY(-0.06em); }
  @keyframes scroll-x {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* Reveal */
  .reveal {
    overflow: hidden;
    display: inline-block;
  }
  .reveal > .r-inner {
    display: inline-block;
    transform: translateY(110%);
    transition: transform 0.9s cubic-bezier(.7,0,.2,1);
    transition-delay: var(--rd, 0ms);
  }
  .reveal.in > .r-inner { transform: translateY(0); }

  .fade-up {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.8,.2,1);
    transition-delay: var(--rd, 0ms);
  }
  .fade-up.in { opacity: 1; transform: translateY(0); }

  /* Work / horizontal scroll */
  .work-wrap {
    position: relative;
  }
  .work-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .work-rail {
    display: flex;
    will-change: transform;
    height: 100%;
    align-items: center;
    padding-left: 32px;
    gap: 48px;
  }
  .work-card {
    flex: 0 0 auto;
    width: min(78vw, 1100px);
    height: 78vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: stretch;
  }
  .work-card .ph {
    position: relative;
    overflow: hidden;
    background: var(--fg);
    color: var(--bg);
  }
  .work-card .ph .mask {
    position: absolute; inset: 0;
    background: var(--bg);
    transform-origin: left;
    transform: scaleX(1);
    transition: transform 1.1s cubic-bezier(.7,0,.2,1);
    transition-delay: var(--rd, 0ms);
  }
  .work-card.in .ph .mask { transform: scaleX(0); }
  .work-card .ph .ph-label {
    position: absolute;
    top: 16px; left: 16px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .work-card .ph .ph-stripes {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(135deg, transparent 0 22px, rgba(255,255,255,0.05) 22px 23px);
    pointer-events: none;
  }
  .work-card .ph svg {
    width: 100%; height: 100%;
    display: block;
  }
  .work-card .meta {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px 0;
  }
  .work-card .meta .idx {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--mute);
    text-transform: uppercase;
  }
  .work-card .meta h3 {
    font-size: clamp(40px, 5vw, 80px);
    font-weight: 500;
    line-height: 0.9;
    letter-spacing: -0.03em;
    margin-top: 16px;
  }
  .work-card .meta .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-top: 12px;
  }
  .work-card .meta .desc {
    margin-top: 24px;
    font-size: 17px;
    line-height: 1.45;
    max-width: 44ch;
    color: var(--fg);
  }
  .work-card .meta .stack {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px;
  }
  .work-card .meta .stack span {
    border: 1px solid var(--line);
    padding: 6px 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .work-card .meta .specs {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .work-card .meta .specs .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--mute);
  }
  .work-card .meta .specs .v {
    font-size: 22px;
    font-weight: 500;
    margin-top: 4px;
    letter-spacing: -0.01em;
  }

  .work-heading {
    padding: 0 32px;
    margin-bottom: 32px;
  }
  .work-heading-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
    align-items: end;
  }
  .work-heading h2 {
    grid-column: span 9;
    font-size: clamp(48px, 8vw, 140px);
    font-weight: 500;
    line-height: 0.88;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .work-heading .count {
    grid-column: span 3;
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--mute);
    text-transform: uppercase;
  }

  /* About */
  .about {
    padding: 160px 32px;
  }
  .about-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
  }
  .about-grid .meta-col { grid-column: span 2; }
  .about-grid .body {
    grid-column: 4 / span 6;
    font-size: clamp(28px, 3vw, 44px);
    line-height: 1.18;
    letter-spacing: -0.015em;
    font-weight: 400;
    text-wrap: pretty;
  }
  .about-grid .body em {
    font-style: normal;
    background: var(--fg);
    color: var(--bg);
    padding: 0 0.12em;
  }
  .about-grid .facts {
    grid-column: 11 / span 2;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .about-grid .facts .row {
    border-top: 1px solid var(--line);
    padding-top: 6px;
  }
  .about-grid .facts .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .about-grid .facts .v {
    font-size: 15px;
    font-weight: 500;
  }

  /* Services */
  .services {
    padding: 140px 32px;
    border-top: 1px solid var(--line);
  }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
  }
  .service-row {
    grid-column: 3 / span 10;
    display: grid;
    grid-template-columns: 60px 1fr 1.4fr 80px;
    gap: 24px;
    align-items: start;
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
    cursor: none;
    position: relative;
    overflow: hidden;
  }
  .service-row:first-of-type { border-top: 1px solid var(--line); }
  .service-row .hover-fill {
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: translateY(101%);
    transition: transform 0.5s cubic-bezier(.7,0,.2,1);
    z-index: 0;
  }
  .service-row:hover .hover-fill { transform: translateY(0); }
  .service-row:hover { color: var(--bg); }
  .service-row > * { position: relative; z-index: 1; }
  .service-row .n {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    padding-top: 12px;
    opacity: 0.7;
  }
  .service-row .t {
    font-size: clamp(28px, 3vw, 44px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .service-row .d {
    font-size: 14px;
    line-height: 1.5;
    padding-top: 4px;
    max-width: 36ch;
  }
  .service-row .arr {
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 18px;
    padding-top: 8px;
    transform: translateX(0);
    transition: transform 0.5s cubic-bezier(.7,0,.2,1);
  }
  .service-row:hover .arr { transform: translateX(8px); }

  /* Process */
  .process {
    padding: 140px 32px;
    background: var(--fg);
    color: var(--bg);
  }
  .process-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
  }
  .process h2 {
    grid-column: 1 / -1;
    font-size: clamp(48px, 9vw, 160px);
    font-weight: 500;
    line-height: 0.88;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  .process h2 .lit {
    display: inline-block;
    -webkit-text-stroke: 1px var(--bg);
    color: transparent;
  }
  .process-step {
    grid-column: span 3;
    border-top: 1px solid rgba(244,242,238,0.25);
    padding-top: 20px;
    min-height: 280px;
    display: flex;
    flex-direction: column;
  }
  .process-step .step-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    opacity: 0.6;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .process-step .step-title {
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 16px;
  }
  .process-step .step-desc {
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.75;
    text-wrap: pretty;
    max-width: 28ch;
  }

  /* Now (draggable) */
  .now {
    padding: 140px 32px 200px;
    position: relative;
    overflow: hidden;
  }
  .now-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
    margin-bottom: 60px;
  }
  .now-grid h2 {
    grid-column: 1 / span 6;
    font-size: clamp(48px, 8vw, 140px);
    font-weight: 500;
    line-height: 0.88;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .now-grid .now-blurb {
    grid-column: 8 / span 5;
    font-size: 16px;
    line-height: 1.5;
    color: var(--mute);
    text-wrap: pretty;
    align-self: end;
    padding-bottom: 12px;
  }
  .now-board {
    position: relative;
    height: 580px;
    border: 1px solid var(--line);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 48px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px 100%;
  }
  .now-card {
    position: absolute;
    width: 280px;
    background: var(--bg);
    border: 1px solid var(--fg);
    padding: 18px 18px 16px;
    user-select: none;
    cursor: none;
    box-shadow: 0 0 0 0 var(--fg);
    transition: box-shadow 0.2s ease, transform 0.05s ease;
  }
  .now-card.dragging { box-shadow: 8px 8px 0 0 var(--fg); z-index: 50; }
  .now-card .nc-tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
  }
  .now-card .nc-tag .dot { width: 6px; height: 6px; background: var(--fg); border-radius: 50%; display: inline-block; }
  .now-card .nc-title {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin-bottom: 10px;
  }
  .now-card .nc-body {
    font-size: 13px;
    line-height: 1.45;
    color: var(--fg);
  }
  .drag-hint {
    position: absolute;
    bottom: 12px; right: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* Contact */
  .contact {
    padding: 140px 32px 80px;
    background: var(--fg);
    color: var(--bg);
    position: relative;
  }
  .contact-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--grid-gutter);
  }
  .contact .label-top {
    grid-column: 1 / -1;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
  }
  .contact h2 {
    grid-column: 1 / -1;
    font-size: clamp(60px, 14vw, 240px);
    font-weight: 500;
    line-height: 0.84;
    letter-spacing: -0.045em;
    text-transform: uppercase;
  }
  .contact h2 .stroke {
    -webkit-text-stroke: 1px var(--bg);
    color: transparent;
  }
  .magnet-wrap {
    grid-column: 1 / span 5;
    margin-top: 48px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .magnet-btn {
    position: relative;
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 1px solid var(--bg);
    background: transparent;
    color: var(--bg);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    will-change: transform;
  }
  .magnet-btn .magnet-inner {
    will-change: transform;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    position: relative;
  }
  .magnet-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--bg);
    border-radius: 50%;
    transform: scale(0);
    transition: transform 0.5s cubic-bezier(.7,0,.2,1);
  }
  .magnet-btn:hover::before { transform: scale(1); }
  .magnet-btn:hover { color: var(--fg); }
  .magnet-btn span { position: relative; z-index: 2; }

  .contact-side {
    grid-column: 8 / span 5;
    margin-top: 48px;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (

function TweakToggle({ label, value, onChange }) {

              role="switch" aria-checked={!!value}

    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {

        {options.map((o) => {

}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"

);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// ---------- Animation hooks ----------

// IntersectionObserver: add .in once visible
function useReveal(ref, opts = {}) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            el.classList.add("in");
            if (opts.once !== false) io.unobserve(el);
          } else if (opts.once === false) {
            el.classList.remove("in");
          }
        });
      },
      { threshold: opts.threshold ?? 0.18, rootMargin: opts.rootMargin ?? "0px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
}

// Scramble text effect — cycles glyphs then resolves to target
function useScramble(ref, text, opts = {}) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789Ξ▒░█◇◯";
    let frame = 0;
    let raf;
    const duration = opts.duration ?? 70; // frames
    const startDelay = opts.delay ?? 0;
    let started = false;

    function tick() {
      const progress = Math.max(0, frame - startDelay) / duration;
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const localP = progress * 1.4 - i / text.length;
        if (localP > 0.8) {
          out += text[i];
        } else if (text[i] === " ") {
          out += " ";
        } else if (localP > 0) {
          out += chars[(Math.random() * chars.length) | 0];
        } else {
          out += " ";
        }
      }
      el.textContent = out;
      frame++;
      if (progress < 1.4) {
        raf = requestAnimationFrame(tick);
      } else {
        el.textContent = text;
      }
    }
    el.textContent = "";
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [text]);
}

    const wrap = wrapRef.current;
    const sticky = stickyRef.current;
    const rail = railRef.current;
    if (!wrap || !sticky || !rail) return;

    function setSize() {
      const railWidth = rail.scrollWidth;
      const viewportW = window.innerWidth;
      const distance = railWidth - viewportW + 64;
      // Wrap height = viewport height + scroll distance
      wrap.style.height = window.innerHeight + Math.max(distance, 0) + "px";
      return distance;
    }
    let distance = setSize();
    window.addEventListener("resize", () => { distance = setSize(); });

    function onScroll() {
      const r = wrap.getBoundingClientRect();
      const total = wrap.offsetHeight - window.innerHeight;

function Now() {
  const boardRef = useRef(null);
  const [positions, setPositions] = useState(null);

  // Distribute initial positions deterministically
  useLayoutEffect(() => {
    const board = boardRef.current;
    if (!board) return;
    const W = board.clientWidth, H = board.clientHeight;
    const slots = [
      { x: 0.05, y: 0.08, r: -4 },
      { x: 0.40, y: 0.04, r: 3 },
      { x: 0.70, y: 0.18, r: -2 },
      { x: 0.10, y: 0.55, r: 5 },
      { x: 0.50, y: 0.50, r: -3 },
    ];
    setPositions(slots.map((s, i) => ({
      x: s.x * W,
      y: s.y * H,
      r: s.r,
    })));
  }, []);

  const onDragStart = (i) => (e) => {
    e.preventDefault();
    const card = e.currentTarget;
    const board = boardRef.current;
    const br = board.getBoundingClientRect();
    const cr = card.getBoundingClientRect();
    const offX = e.clientX - cr.left;
    const offY = e.clientY - cr.top;
    card.classList.add("dragging");
    document.body.dataset.dragging = "1";

    const onMove = (ev) => {
      const x = ev.clientX - br.left - offX;
      const y = ev.clientY - br.top - offY;
      const clampedX = Math.max(-20, Math.min(br.width - cr.width + 20, x));
      const clampedY = Math.max(-20, Math.min(br.height - cr.height + 20, y));
      setPositions((p) => {
        const copy = [...p];
        copy[i] = { ...copy[i], x: clampedX, y: clampedY };
        return copy;
      });
    };
    const onUp = () => {
      card.classList.remove("dragging");
      delete document.body.dataset.dragging;
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const headRef = useRef(null);
  useReveal(headRef);

  return (
    <section className="now" id="now">
      <div className="now-grid">
        <h2>
          <span className="reveal" ref={headRef}><span className="r-inner">Now</span></span>
        </h2>
        <div className="now-blurb">
          A snapshot of what's on the desk this week — drag the cards around, they remember nothing, which is the point.
        </div>
      </div>
      <div className="now-board" ref={boardRef}>
        {positions && NOW_CARDS.map((c, i) => (
          <div
            key={i}
            className="now-card"
            data-cursor="drag"
            style={{
              left: 0,
              top: 0,
              transform: `translate(${positions[i].x}px, ${positions[i].y}px) rotate(${positions[i].r}deg)`,
            }}
            onMouseDown={onDragStart(i)}
          >
            <div className="nc-tag"><span>{c.tag}</span><span className="dot"></span></div>
            <div className="nc-title">{c.title}</div>
            <div className="nc-body">{c.body}</div>
          </div>
        ))}
        <div className="drag-hint">[ Drag · grab any card ]</div>
      </div>
    </section>
  );
}

// ---------- Cursor ----------

function CursorController() {
  useEffect(() => {
    const dot = document.getElementById("cDot");
    const ring = document.getElementById("cRing");
    if (!dot || !ring) return;

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my;
    let visible = false;

    const onMove = (e) => {
      mx = e.clientX;
      my = e.clientY;
      if (!visible) {
        visible = true;
        dot.style.opacity = "1";
        ring.style.opacity = "1";
      }

      // Detect cursor mode based on hovered element
      const el = document.elementFromPoint(e.clientX, e.clientY);
      let mode = "default";
      let label = "";
      if (el) {
        const closest = el.closest("[data-cursor], a, button, [data-link]");
        if (closest) {
          const c = closest.getAttribute("data-cursor");
          if (c === "drag") { mode = "drag"; label = "DRAG"; }
          else if (c === "view") { mode = "view"; label = "VIEW"; }
          else if (c === "expand") { mode = "expand"; label = "OPEN"; }
          else if (c === "send") { mode = "send"; label = "SEND"; }
          else if (closest.tagName === "A" || closest.tagName === "BUTTON" || closest.hasAttribute("data-link")) {
            mode = "link";
          }
        }
      }
      ring.classList.toggle("is-link", mode === "link");
      ring.classList.toggle("is-drag", mode === "drag" || mode === "view" || mode === "expand" || mode === "send");
      ring.textContent = label;
    };

    const onLeave = () => {
      visible = false;
      dot.style.opacity = "0";
      ring.style.opacity = "0";
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseleave", onLeave);

    // RAF loop — ring trails
    let raf;
    const loop = () => {
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
      ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseleave", onLeave);
      cancelAnimationFrame(raf);
    };
  }, []);
  return null;
}

// ---------- Magnetic for nav links ----------

function MagneticNav() {
  useEffect(() => {
    const links = document.querySelectorAll(".nav-links a, .channel");
    const handlers = [];
    links.forEach((link) => {
      const onMove = (e) => {
        const r = link.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        const dist = Math.hypot(dx, dy);
        if (dist < 100) {
          const s = (1 - dist / 100) * 0.5;
          link.style.transform = `translate(${dx * s}px, ${dy * s * 0.4}px)`;
        } else {
          link.style.transform = "";
        }
      };
      const onLeave = () => { link.style.transform = ""; };
      window.addEventListener("mousemove", onMove);
      link.addEventListener("mouseleave", onLeave);
      handlers.push({ link, onMove, onLeave });
    });
    return () => {
      handlers.forEach(({ link, onMove, onLeave }) => {
        window.removeEventListener("mousemove", onMove);
        link.removeEventListener("mouseleave", onLeave);
      });
    };
  }, []);
  return null;
}

// ---------- Page reveal: count up then lift ----------

function PageReveal() {
  useEffect(() => {
    const el = document.getElementById("countNum");
    if (!el) return;
    let n = 0;
    const start = performance.now();
    const dur = 1400;
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      n = Math.floor(eased * 99);
      el.textContent = String(n).padStart(2, "0");
      if (p < 1) raf = requestAnimationFrame(tick);
      else el.textContent = "99";
    };
    raf = requestAnimationFrame(tick);
    // remove overlay after reveal completes
    setTimeout(() => {
      const r = document.getElementById("pageReveal");
      if (r) r.style.display = "none";
    }, 2200);
    return () => cancelAnimationFrame(raf);
  }, []);
  return null;
}

const PALETTES = {
  warm:   { fg: "#0a0a0a", bg: "#f4f2ee", mute: "#8a8680", line: "rgba(10,10,10,0.12)" },
  pure:   { fg: "#0a0a0a", bg: "#fafafa", mute: "#888888", line: "rgba(10,10,10,0.10)" },
  cool:   { fg: "#0c1014", bg: "#eef1f4", mute: "#7a8593", line: "rgba(12,16,20,0.12)" },
  dark:   { fg: "#f0ece4", bg: "#0c0b09", mute: "#787268", line: "rgba(240,236,228,0.14)" },
  inkPaper: { fg: "#16110d", bg: "#e9e2d0", mute: "#7a6e58", line: "rgba(22,17,13,0.14)" },
};

function applyPalette(key) {
  const p = PALETTES[key] || PALETTES.warm;
  const r = document.documentElement;
  r.style.setProperty("--fg", p.fg);
  r.style.setProperty("--bg", p.bg);
  r.style.setProperty("--mute", p.mute);
  r.style.setProperty("--line", p.line);
}

function Tweaks() {
  const defaults = window.__TWEAK_DEFAULTS || { palette: "warm" };
  const [t, setTweak] = useTweaks(defaults);

  useEffect(() => {
    applyPalette(t.palette);
  }, [t.palette]);

  return (
    <TweaksPanel>
      <TweakSection label="Palette">
        <PaletteSwatches
          label="Color system"
          value={t.palette}
          onChange={(v) => setTweak("palette", v)}
          options={[
            ["#f4f2ee", "#0a0a0a", "#8a8680"],
            ["#fafafa", "#0a0a0a", "#888888"],
            ["#eef1f4", "#0c1014", "#7a8593"],
            ["#0c0b09", "#f0ece4", "#787268"],
            ["#e9e2d0", "#16110d", "#7a6e58"],
          ]}
        />
        <div className="mono" style={{ fontSize: 10, opacity: 0.6, letterSpacing: "0.1em", textTransform: "uppercase", marginTop: 8 }}>
          {[
            "Warm paper — default",
            "Pure mono",
            "Cool slate",
            "Inverted · dark",
            "Ink on craft",
          ][["warm","pure","cool","dark","inkPaper"].indexOf(t.palette)]}
        </div>
      </TweakSection>
    </TweaksPanel>
  );
}

// Custom palette picker — stores a key ('warm', 'pure', etc.) rather than the
// raw array, so we can map to a CSS variable set in applyPalette().
function PaletteSwatches({ label, value, onChange, options }) {
  // value is one of the keys ('warm', etc) — map to index
  const keys = ["warm", "pure", "cool", "dark", "inkPaper"];
  const idx = Math.max(0, keys.indexOf(value));
  return (
    <div>
      {label && <div style={{ fontSize: 11, marginBottom: 8, opacity: 0.7, fontFamily: "JetBrains Mono, monospace", letterSpacing: "0.06em", textTransform: "uppercase" }}>{label}</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
        {options.map((palette, i) => (
          <button
            key={i}
            onClick={() => onChange(keys[i])}
            style={{
              padding: 0,
              border: idx === i ? "2px solid #000" : "1px solid rgba(0,0,0,0.2)",
              background: palette[0],
              height: 56,
              position: "relative",
              cursor: "none",
              overflow: "hidden",
            }}
            aria-label={keys[i]}
          >
            <div style={{ position: "absolute", inset: 0, display: "flex" }}>
              <div style={{ flex: 1, background: palette[0] }}></div>
              <div style={{ flex: 1, background: palette[1] }}></div>
              <div style={{ position: "absolute", right: 6, bottom: 6, width: 10, height: 10, background: palette[2] }}></div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}
